name: app-tests-and-exe

# 푸시할 때마다 서버·앱 시험을 돌리고, 윈도우용 WJApp.exe(파이썬 없이 실행)를 만들어 아티팩트로 올린다.
# 태그(app-v0.4.0 처럼)를 붙여 푸시하면 같은 파일을 릴리스에도 올린다.
on:
  push:
    branches: ['**']
    tags: ['app-v*']
    paths: ['desktop_app/**', 'pc_server/**', '.github/workflows/app.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PC 서버 시험
        run: |
          python -I pc_server/tests/test_server.py
          python -I pc_server/tests/test_restore.py
          python -I pc_server/tests/test_backup.py
      - name: 앱 시험 (가짜 서버)
        run: |
          python -I desktop_app/tests/test_data_cache.py
          python -I desktop_app/tests/test_bench.py

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 빌드
        working-directory: desktop_app
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name WJApp --icon wj_app.ico wj_app.py
      - name: 만든 exe 가 실제로 시작되고 끝나는지 (--version, 창 없이)
        shell: powershell
        run: |
          $p = Start-Process -FilePath ".\desktop_app\dist\WJApp.exe" -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WJApp.exe exit code $($p.ExitCode)" }
          $size = (Get-Item ".\desktop_app\dist\WJApp.exe").Length
          Write-Host "WJApp.exe size: $([math]::Round($size/1MB,1)) MB"
      - uses: actions/upload-artifact@v4
        with:
          name: WJApp-windows
          path: desktop_app/dist/WJApp.exe
      - name: 릴리스에 올리기 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop_app/dist/WJApp.exe

  windows-install:
    # 담당자 PC 와 같은 환경(Windows PowerShell 5.1)에서 설치 스크립트를 실제로 실행해 결과를 확인한다.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 모든 .ps1 문법 검사 (PowerShell 파서)
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs)
            if ($errs.Count -gt 0) { $bad++; $errs | ForEach-Object { Write-Host "SYNTAX ERROR $($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($bad -gt 0) { exit 1 }
      - name: install_wj.ps1 실행 (바탕화면 아이콘 + 로그인 시 자동 실행)
        shell: powershell
        run: .\desktop_app\install_wj.ps1 -ApiUrl "http://127.0.0.1:9/exec" -Startup
      - name: (diag) shortcut save - ascii name vs hangul name (always runs; ascii-only script on purpose)
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $desk = [Environment]::GetFolderPath('Desktop')
          $venvPyw = Join-Path $env:LOCALAPPDATA 'WJApp\venv\Scripts\pythonw.exe'
          $ico = Join-Path $env:LOCALAPPDATA 'WJApp\app\wj_app.ico'
          Write-Host "Desktop=$desk exists=$(Test-Path $desk)"
          Write-Host "pythonw exists=$(Test-Path $venvPyw)  ico exists=$(Test-Path $ico)"
          $korean = [string]::Concat([char]0xC601, [char]0xC5C5, [char]0xC77C, [char]0xC9C0, '.lnk')
          Write-Host ("korean name length=" + $korean.Length)
          $sh = New-Object -ComObject WScript.Shell
          function Try-Save($label, $file, $target, $icon) {
            try {
              $p = Join-Path $desk $file
              $s = $sh.CreateShortcut($p)
              $s.TargetPath = $target
              if ($icon) { $s.IconLocation = $icon }
              $s.Save()
              Write-Host ("[" + $label + "] OK exists=" + (Test-Path $p))
              Remove-Item $p -Force -ErrorAction SilentlyContinue
            } catch { Write-Host ("[" + $label + "] FAIL " + $_.Exception.GetType().Name + " " + $_.Exception.Message) }
          }
          Try-Save 'ascii + notepad'            'wjtest.lnk' 'C:\Windows\System32\notepad.exe' $null
          Try-Save 'hangul + notepad'           $korean      'C:\Windows\System32\notepad.exe' $null
          Try-Save 'ascii + pythonw'            'wjtest.lnk' $venvPyw $null
          Try-Save 'ascii + pythonw + ico,0'    'wjtest.lnk' $venvPyw ($ico + ',0')
          Try-Save 'hangul + pythonw + ico,0'   $korean      $venvPyw ($ico + ',0')
      - name: 설치 결과 확인
        shell: powershell
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'WJApp'
          foreach ($f in @('app\wj_app.py', 'app\wj_app.ico', 'venv\Scripts\pythonw.exe', 'venv\Scripts\python.exe', 'api_url.txt')) {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing after install: $f" } else { Write-Host "found: $f" }
          }
          $name = [string]::Concat([char]0xC601, [char]0xC5C5, [char]0xC77C, [char]0xC9C0, '.lnk')
          foreach ($d in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Startup'))) {
            $l = Join-Path $d $name
            if (-not (Test-Path $l)) { throw "shortcut missing: $l" }
            $s = (New-Object -ComObject WScript.Shell).CreateShortcut($l)
            Write-Host "shortcut $l -> $($s.TargetPath) $($s.Arguments)"
            if (-not (Test-Path $s.TargetPath)) { throw "shortcut target missing: $($s.TargetPath)" }
          }
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $app 'api_url.txt'))
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw 'api_url.txt has a BOM (the app would misread the URL)' }
          $url = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($url -ne 'http://127.0.0.1:9/exec') { throw "api_url.txt content differs: $url" }
          $v = & (Join-Path $app 'venv\Scripts\python.exe') (Join-Path $app 'app\wj_app.py') --version
          Write-Host "installed app version: $v"
          if (-not $v) { throw 'installed app does not run' }
          & (Join-Path $app 'venv\Scripts\python.exe') -c "import webview; print('pywebview installed')"
          if ($LASTEXITCODE -ne 0) { throw 'pywebview not installed' }
      - name: 다시 실행해도 서버 주소·저장본이 유지되는지 (재설치)
        shell: powershell
        run: |
          .\desktop_app\install_wj.ps1
          $app = Join-Path $env:LOCALAPPDATA 'WJApp'
          if ((Get-Content (Join-Path $app 'api_url.txt') -Raw) -ne 'http://127.0.0.1:9/exec') { throw 'reinstall changed the server URL' }
      - name: 윈도우 실제 환경 점검 (DPAPI 암호화, 앱 서버, 자동 로그인)
        run: python -I desktop_app/tests/win_smoke.py
      - name: 앱 시험을 윈도우에서도 (저장본·속도 도구)
        run: |
          python -I desktop_app/tests/test_data_cache.py
          python -I desktop_app/tests/test_bench.py
      - name: 삭제 (-Uninstall)
        shell: powershell
        run: |
          .\desktop_app\install_wj.ps1 -Uninstall
          $name = [string]::Concat([char]0xC601, [char]0xC5C5, [char]0xC77C, [char]0xC9C0, '.lnk')
          foreach ($d in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Startup'))) {
            if (Test-Path (Join-Path $d $name)) { throw "shortcut remained after uninstall: $d" }
          }
